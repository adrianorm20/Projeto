<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

</head>

<body class="auth-page">

  <div class="auth-wrapper">

    <!-- LOGIN -->
    <div class="auth-panel login">
      <p class="panel-label">Acesso</p>
      <div class="accent-bar accent-login"></div>
      <h1 class="panel-title">Bem-vindo<br>de volta.</h1>
      <p class="panel-sub">Entre na sua conta para continuar.</p>

      <div class="social-row">
        <button class="btn-social">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Google
        </button>
        <button class="btn-social">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 0C5.374 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0 1 12 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z"/>
          </svg>
          GitHub
        </button>
      </div>

      <div class="divider">ou</div>

      <div class="field">
        <label for="login-email">E-mail</label>
        <input id="login-email" type="email" placeholder="voce@email.com">
      </div>
      <div class="field">
        <label for="login-senha">Senha</label>
        <input id="login-senha" type="password" placeholder="••••••••">
        <a class="forgot" href="#">Esqueceu a senha?</a>
      </div>

      <button class="btn-primary btn-login" onclick="Login()">Entrar</button>
    </div>

    <!-- CADASTRO -->
    <div class="auth-panel signup">
      <p class="panel-label">Novo aqui?</p>
      <div class="accent-bar accent-signup"></div>
      <h1 class="panel-title">Crie sua<br>conta grátis.</h1>
      <p class="panel-sub">Leva menos de um minuto.</p>

      <div class="field">
        <label for="nome">Nome completo</label>
        <input id="nome" type="text" placeholder="Ana Souza">
      </div>
      <div class="field">
        <label for="signup-email">E-mail</label>
        <input id="signup-email" type="email" placeholder="voce@email.com">
      </div>
      <div class="field">
        <label for="signup-senha">Senha</label>
        <input id="signup-senha" type="password" placeholder="Mínimo 8 caracteres">
      </div>
      <div class="field">
        <label for="confirmar-senha">Confirmar senha</label>
        <input id="confirmar-senha" type="password" placeholder="Repita a senha">
      </div>

      <button class="btn-primary btn-signup" onclick="Cadastro()">Criar conta</button>
      <p class="terms">
        Ao criar uma conta você concorda com os
        <a href="#">Termos de Uso</a> e a <a href="#">Política de Privacidade</a>.
      </p>
    </div>

  </div>
<script src="script.js"></script>
</body>

</html>
